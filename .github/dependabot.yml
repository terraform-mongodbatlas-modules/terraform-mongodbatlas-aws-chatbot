# Destination-owned Dependabot configuration.
# The repository vendors the hybrid-search app under chatbot/, which is not
# SDLC-synced, so this file is not a copy of the shared dependabot_destination.yml.
# Keep the github-actions entry aligned with the cluster config by hand.
# The SDLC-synced uv /tools and gomod surfaces stay cluster-owned; do not add
# entries for them here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/chatbot"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      python-deps:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
