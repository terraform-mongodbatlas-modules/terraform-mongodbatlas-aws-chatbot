examples_readme:
  readme_template: docs/example_readme.md
  # minimal and healthcare are single copy-paste main.tf files with no generated
  # versions.tf, so the generator leaves them alone and their READMEs are hand-written.
  skip_examples: ["minimal", "healthcare"]
  code_snippet_files:
    additional: []
  template_vars:
    production_considerations_comment: ""
    production_considerations: ""
    skip_if_name_contains: []
  versions_tf: {}
    # add: |
    #   provider "mongodbatlas" {}
    # skip_if_name_contains: []
    # generate_when_missing_only: false
    # force_generate: false

tables:
  - name: Examples
    columns: ["feature", "name", "description"]
    link_column: name
    example_rows:
      - folder_name: minimal
        feature: Chatbot
        name: Minimal deployment
        description: >-
          Deploys the hybrid search chatbot on AWS with MongoDB Atlas in one
          `terraform apply`.
      - folder_name: healthcare
        feature: Chatbot
        name: Healthcare corpus
        description: >-
          Deploys the chatbot with a fictional healthcare corpus, showing how to
          name your own documents with `document_dirs` instead of the bundled
          repository docs.
